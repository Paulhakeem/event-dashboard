name: Deploy Velora Events

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            LIVE_DIR="/var/www/velora-events"
            BUILD_DIR="/var/www/velora-events-build"
            BACKUP_DIR="/var/www/velora-events-backup"
            ENV_BACKUP_DIR="/root/.env-backups/velora-events"
            ENV_SAFE="$ENV_BACKUP_DIR/.env"
            ENV_ADMIN_SAFE="$ENV_BACKUP_DIR/.env.admin"

            echo "🔄 Starting zero-downtime deployment..."
            mkdir -p /var/www "$ENV_BACKUP_DIR"

            # ── 1. Backup .env files BEFORE anything ──
            echo "💾 Backing up .env files..."
            if [ -f "$LIVE_DIR/apps/web/.env" ]; then
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              cp "$LIVE_DIR/apps/web/.env" "$ENV_SAFE"
              cp "$LIVE_DIR/apps/web/.env" "$ENV_BACKUP_DIR/.env.$TIMESTAMP"
              ls -t "$ENV_BACKUP_DIR"/.env.* 2>/dev/null | tail -n +6 | xargs -r rm --
              echo "✅ Web .env backed up"
            elif [ -f "$ENV_SAFE" ]; then
              echo "⚠️  No live web .env found — existing backup will be used"
            else
              echo "❌ No web .env found anywhere — aborting"
              exit 1
            fi

            if [ -f "$LIVE_DIR/apps/admin/.env" ]; then
              cp "$LIVE_DIR/apps/admin/.env" "$ENV_ADMIN_SAFE"
              echo "✅ Admin .env backed up"
            elif [ -f "$ENV_ADMIN_SAFE" ]; then
              echo "⚠️  No live admin .env found — existing backup will be used"
            else
              echo "⚠️  No admin .env found — will copy from web .env"
            fi

            # ── 2. Clone fresh copy ──────────────────────────────────────────
            echo "📥 Cloning fresh copy..."
            rm -rf "$BUILD_DIR"
            git clone git@github-velora:Paulhakeem/event-dashboard.git "$BUILD_DIR"
            echo "✅ Cloned"

            # ── 3. Restore .env files into the build ─────────────────────────
            echo "🔑 Restoring .env files..."
            cp "$ENV_SAFE" "$BUILD_DIR/apps/web/.env"
            echo "✅ Web .env restored"

            if [ -f "$ENV_ADMIN_SAFE" ]; then
              cp "$ENV_ADMIN_SAFE" "$BUILD_DIR/apps/admin/.env"
              echo "✅ Admin .env restored"
            else
              cp "$ENV_SAFE" "$BUILD_DIR/apps/admin/.env"
              echo "✅ Admin .env copied from web .env"
            fi

            # ── 4. Install dependencies & build ─────────────────────────────
            echo "📦 Installing dependencies..."
            cd "$BUILD_DIR"
            npm install -g pnpm@latest
            pnpm install --no-frozen-lockfile --ignore-scripts
            pnpm approve-builds --yes
            pnpm rebuild
            echo "🏗️  Building web and admin apps..."
            pnpm run build
            echo "✅ Build complete"

            # ── 5. Swap live directory (zero-downtime) ───────────────────────
            echo "🔁 Swapping live directory..."
            rm -rf "$BACKUP_DIR"
            [ -d "$LIVE_DIR" ] && mv "$LIVE_DIR" "$BACKUP_DIR"
            mv "$BUILD_DIR" "$LIVE_DIR"
            echo "✅ Directory swapped"

            # ── 6. Fix permissions ───────────────────────────────────────────
            chown -R www-data:www-data "$LIVE_DIR"
            chmod -R 755 "$LIVE_DIR"
            chmod 600 "$LIVE_DIR/apps/web/.env"
            chmod 600 "$LIVE_DIR/apps/admin/.env"

            # ── 7. Restart apps with PM2 ─────────────────────────────────────
            echo "♻️  Restarting apps with PM2..."
            cd "$LIVE_DIR"
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            echo "✅ PM2 restarted"

            echo ""
            echo "🎉 Deployment complete!"
